# Emergency Tunnel release host — nginx site.
#
# Serves the installer, channel pointers and release assets over HTTPS from
# /var/www/emergency-tunnel. Obtain the certificate first, e.g.:
#   certbot --nginx -d dl.example.com
#
# Then: ln -s this file into /etc/nginx/sites-enabled/ (or /etc/nginx/conf.d/),
#   nginx -t && systemctl reload nginx
#
# Replace dl.example.com with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;
    # Redirect everything to HTTPS (installer refuses plain HTTP by default).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dl.example.com;

    ssl_certificate     /etc/letsencrypt/live/dl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/emergency-tunnel;
    autoindex off;                       # never list directories
    server_tokens off;

    # Serve shell scripts and channel/checksum files as plain text so
    # `curl | bash` and browsers behave predictably.
    location ~ \.sh$        { default_type text/x-shellscript; add_header Cache-Control "no-cache"; }
    location = /install.sh  { default_type text/x-shellscript; add_header Cache-Control "no-cache"; }
    location = /stable      { default_type text/plain; add_header Cache-Control "no-cache"; }
    location = /beta        { default_type text/plain; add_header Cache-Control "no-cache"; }

    # Immutable, versioned release assets can be cached hard.
    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: static, no fancy handling.
    location / {
        try_files $uri =404;
    }

    # Do not serve dotfiles or the signing secret if it ever lands here.
    location ~ /\.        { deny all; }
    location ~ \.sec$     { deny all; }
    location ~ \.key$     { deny all; }
}
